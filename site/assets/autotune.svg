<path d="M 590 224 C 625 224 625 268 660 268" fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7" class="flow"/>
<path d="M 590 224 C 625 224 625 310 660 310" fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7" class="flow"/>
