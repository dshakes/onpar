# Build the public site and deploy it to GitHub Pages as one artifact:
#   https://dshakes.github.io/onpar/       <- landing page (site/index.html), /assets, /install.sh
#   https://dshakes.github.io/onpar/lab/   <- interactive memory lab and CLI reference
#   https://dshakes.github.io/onpar/docs/  <- Starlight, generated from docs/*.md and docs/adr/*.md
# Plain static HTML, no server. The build fails on any broken internal docs link.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", ".github/workflows/pages.yml"]
  # PRs build the site (diagrams, assets, links) without deploying.
  pull_request:
    paths: ["site/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Pages deploy needs these; least-privilege otherwise.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Diagrams live in docs/assets and are the source of truth; the site copies
      # them at build time so the two can never drift.
      - run: |
          mkdir -p site/assets
          cp docs/assets/*.svg site/assets/
      # A heredoc, not `python -c "..."`: YAML folds a multi-line plain scalar onto
      # one line, which turns the script into a syntax error.
      - name: diagrams must be valid XML
        run: |
          python - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('site/assets/*.svg')
          if not files:
              print('no SVGs found — the copy step above did not run'); sys.exit(1)
          for f in files:
              ET.parse(f)
          print(f'{len(files)} svgs ok')
          PY
      - name: every referenced asset must exist
        run: |
          python - <<'PY'
          import re, pathlib, sys
          html = pathlib.Path('site/index.html').read_text()
          missing = [s for s in re.findall(r'src="(assets/[^"]+)"', html)
                     if not (pathlib.Path('site') / s).exists()]
          if missing:
              print('missing assets:', missing); sys.exit(1)
          print('all assets present')
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      # prebuild syncs docs/ into Starlight, the build validates every internal link,
      # postbuild copies the landing page, assets and lab into site/dist.
      - name: build site
        run: cd site && npm ci && npm run build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
