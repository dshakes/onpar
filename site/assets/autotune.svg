<path d="M 590 224 C 625 224 625 142 660 142" fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7" class="flow"/>
<path d="M 590 224 C 625 224 625 184 660 184" fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7" class="flow"/>
