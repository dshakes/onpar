<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,system-ui,sans-serif">
<title id='t'>Agentic evals: the step is the unit</title><desc id='d'>Left: one captured step replayed teacher-forced — the candidate receives the system prompt, every prior turn, the tool results and the tool schemas the incumbent had, and is graded on the one move it makes: same tool, arguments valid against the offered schema, no tool call leaked as text, the judge shown both calls. Right: a whole session replayed from the recording — the candidate's own turns are kept, its tool calls are answered with the results the incumbent received, and the session stops at the first call the recording cannot answer. A miss is a stop, never a live tool call.</desc>
<style>
:root{--s0:#0e9bbd;--s1:#8b5cf6;--s2:#c2820b;--s3:#e0405f;--bg:#0d1320;--panel:#111a2b;--ink:#eef4ff;--ink2:#9fb0cc;--muted:#63758f;--grid:#1c2534;}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--s0:#0369a1;--s1:#7e22ce;--s2:#b45309;--s3:#15803d;--bg:#fcfcfb;--panel:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--grid:#e3e3e0;}}
:root[data-theme=light]{--s0:#0369a1;--s1:#7e22ce;--s2:#b45309;--s3:#15803d;--bg:#fcfcfb;--panel:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--grid:#e3e3e0;}
.t{fill:var(--ink);font-size:15px;font-weight:650}.sub{fill:var(--ink2);font-size:11.5px}.lb{fill:var(--ink2);font-size:11px}.ax{fill:var(--muted);font-size:10.5px}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;fill:var(--ink2)}.g{stroke:var(--grid);stroke-width:1}.note{fill:var(--muted);font-size:10.5px;font-style:italic}@keyframes clkpulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes clkflow{to{stroke-dashoffset:-28}}@keyframes clkpop{0%{opacity:0}3%{opacity:1}92%{opacity:1}100%{opacity:0}}.pulse{animation:clkpulse 2.4s ease-in-out infinite}.flow{animation:clkflow 1.1s linear infinite}.pop{animation:clkpop 6s linear infinite both}@keyframes clkstream{from{transform:translateX(0)}to{transform:translateX(46px)}}@keyframes clklight{0%,12%{opacity:.10}26%,68%{opacity:1}84%,100%{opacity:.10}}.stream{transform-box:fill-box;animation:clkstream 1.15s linear infinite}.light{animation:clklight 3.45s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.pulse,.flow,.pop,.stream,.light{animation:none;opacity:1;transform:none}}
</style>
<rect width="860" height="470" fill="var(--bg)"/>
<text x="28" y="30" class="t">Agentic evals: the step is the unit</text>
<text x="40" y="66" class="t" style="font-size:13px">One step, teacher-forced</text>
<rect x="40" y="84" width="370" height="32" rx="6" fill="var(--panel)"/>
<rect x="40" y="84" width="4" height="32" rx="2" fill="#63758f"/>
<text x="54" y="104" class="lb">system</text>
<text x="150" y="104" class="m">You are the refunds desk. Use tools.</text>
<rect x="40" y="124" width="370" height="32" rx="6" fill="var(--panel)"/>
<rect x="40" y="124" width="4" height="32" rx="2" fill="#0e9bbd"/>
<text x="54" y="144" class="lb">user</text>
<text x="150" y="144" class="m">refund order 42</text>
<rect x="40" y="164" width="370" height="32" rx="6" fill="var(--panel)"/>
<rect x="40" y="164" width="4" height="32" rx="2" fill="#8b5cf6"/>
<text x="54" y="184" class="lb">assistant</text>
<text x="150" y="184" class="m">→ lookup({"order_id": 42})</text>
<rect x="40" y="204" width="370" height="32" rx="6" fill="var(--panel)"/>
<rect x="40" y="204" width="4" height="32" rx="2" fill="#c2820b"/>
<text x="54" y="224" class="lb">tool</text>
<text x="150" y="224" class="m">{"status": "delivered", "amount": 80}</text>
<rect x="40" y="244" width="370" height="32" rx="6" fill="var(--panel)"/>
<rect x="40" y="244" width="4" height="32" rx="2" fill="#63758f"/>
<text x="54" y="264" class="lb">tools offered</text>
<text x="150" y="264" class="m">lookup · refund · escalate</text>
<text x="40" y="300" class="sub">everything the incumbent saw goes back →</text>
<rect x="40" y="312" width="370" height="34" rx="6" fill="none" stroke="#0e9bbd" stroke-width="1.5"/>
<text x="54" y="334" class="lb">candidate</text>
<text x="150" y="334" class="m">→ refund({"order_id": 42, "amount": 80})</text>
<text x="54" y="372" class="sub">✓ same tool as the incumbent?  (decision agreement, κ)</text>
<text x="54" y="389" class="sub">✓ arguments valid against the offered schema?</text>
<text x="54" y="406" class="sub">✓ a tool call leaked as text?  (server parser fault)</text>
<text x="54" y="423" class="sub">✓ judge sees both calls, not two empty strings</text>
<text x="450" y="66" class="t" style="font-size:13px">Whole session, from the recording</text>
<rect x="450" y="84" width="370" height="50" rx="7" fill="var(--panel)"/>
<rect x="450" y="84" width="5" height="50" rx="2.5" fill="#0e9bbd"/>
<text x="468" y="105" class="t" style="font-size:13px">step 1 · lookup  ✓</text>
<text x="468" y="123" class="sub">same call → recorded result fed back</text>
<rect x="450" y="146" width="370" height="50" rx="7" fill="var(--panel)"/>
<rect x="450" y="146" width="5" height="50" rx="2.5" fill="#0e9bbd"/>
<text x="468" y="167" class="t" style="font-size:13px">step 2 · refund  ✓</text>
<text x="468" y="185" class="sub">same call → recorded result fed back</text>
<rect x="450" y="208" width="370" height="50" rx="7" fill="var(--panel)"/>
<rect x="450" y="208" width="5" height="50" rx="2.5" fill="#e0405f"/>
<text x="468" y="229" class="t" style="font-size:13px">step 3 · escalate  ✗ diverged</text>
<text x="468" y="247" class="sub">incumbent answered in text; candidate escalated</text>
<rect x="450" y="270" width="370" height="50" rx="7" fill="none" stroke="#63758f" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="450" y="270" width="5" height="50" rx="2.5" fill="#63758f"/>
<text x="468" y="291" class="t" style="font-size:13px">step 4 · —  </text>
<text x="468" y="309" class="sub">not reached: the recording cannot answer that call</text>
<text x="450" y="346" class="sub">2 of 3 recorded steps completed · path agreement with interval</text>
<text x="40" y="448" class="note">A different route to the same outcome reads as diverged. No tool is ever executed; the recording is the only source of results.</text>
</svg>